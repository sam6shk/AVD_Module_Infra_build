name: $(BuildDefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - modules/**
      - environments/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - master

parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: action
    displayName: Terraform Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - name: TERRAFORM_VERSION
    value: '1.8.5'
  - name: AZURE_SERVICE_CONNECTION
    value: 'azure-spn-avd-connection' # Replace with your Azure DevOps Service Connection name

stages:
  - stage: Validate
    displayName: "Terraform Validate & Lint"
    jobs:
      - job: ValidateCode
        displayName: "Validate Terraform Code"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: HashiCorpInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: '$(TERRAFORM_VERSION)'

          - script: |
              echo "==> Running Terraform Format Check..."
              terraform fmt -check -recursive
            displayName: "Terraform Format Check"

          - script: |
              echo "==> Validating DEV environment..."
              cd environments/dev
              terraform init -backend=false
              terraform validate

              echo "==> Validating PROD environment..."
              cd ../prod
              terraform init -backend=false
              terraform validate
            displayName: "Terraform Init & Validate"

  - stage: Plan
    displayName: "Terraform Plan (${{ parameters.environment }})"
    dependsOn: Validate
    jobs:
      - job: PlanJob
        displayName: "Plan Infrastructure"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: HashiCorpInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: '$(TERRAFORM_VERSION)'

          - task: AzureCLI@2
            displayName: "Terraform Init & Plan (${{ parameters.environment }})"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                cd environments/${{ parameters.environment }}
                
                echo "==> Initializing Terraform for ${{ parameters.environment }}..."
                terraform init

                echo "==> Running Terraform Plan..."
                terraform plan -out=tfplan -var-file="terraform.tfvars"

  - stage: Apply
    displayName: "Terraform Apply (${{ parameters.environment }})"
    dependsOn: Plan
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    jobs:
      - deployment: ApplyJob
        displayName: "Deploy Infrastructure"
        pool:
          vmImage: 'ubuntu-latest'
        environment: '${{ parameters.environment }}-avd-environment'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HashiCorpInstaller@1
                  displayName: "Install Terraform"
                  inputs:
                    terraformVersion: '$(TERRAFORM_VERSION)'

                - task: AzureCLI@2
                  displayName: "Terraform Apply (${{ parameters.environment }})"
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      cd environments/${{ parameters.environment }}

                      echo "==> Initializing Terraform..."
                      terraform init

                      echo "==> Applying Terraform Infrastructure..."
                      terraform apply -auto-approve -var-file="terraform.tfvars"
